kind = "web"
previewPath = "/"
title = "Orblitz"
description = "Orblitz is a 3D arcade browser game built with React Three Fiber. Players control an orb and battle through waves of enemies and bosses across multiple worlds."
version = "1.0.0"
id = "artifacts/orblitz"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/orblitz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orblitz", "run", "build" ]
serve = "static"
publicDir = "artifacts/orblitz/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"